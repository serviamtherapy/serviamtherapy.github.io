<section
    id="reviews"
    class="reviews-section"
>

    <div class="container">

        <div class="section-heading centered">

            <span class="section-label">
                GOOGLE REVIEWS
            </span>

            <h2>
                לקוחות מספרים
                <span>
                    על החוויה שלהם.
                </span>
            </h2>

            <p>
                הדירוג ומספר חוות הדעת
                מתעדכנים ישירות מ-Google.
            </p>

        </div>


        <div
            class="google-rating-summary"
            id="google-rating-summary"
            aria-live="polite"
        >

            <div class="google-rating-stars">

                <span id="google-rating-stars">
                    ★★★★★
                </span>

            </div>


            <div class="google-rating-number">

                <strong id="google-rating-number">
                    —
                </strong>

                <span>
                    מתוך 5
                </span>

            </div>


            <div class="google-rating-count">

                <span id="google-review-count">
                    טוען נתונים מ-Google...
                </span>

            </div>

        </div>


        <div
            class="google-reviews-grid"
            id="google-reviews-grid"
        >

            <div class="google-reviews-loading">

                <span class="review-loading-dot"></span>
                <span class="review-loading-dot"></span>
                <span class="review-loading-dot"></span>

                <p>
                    טוען נתונים מ-Google...
                </p>

            </div>

        </div>


        <div class="google-reviews-footer">

            <a
                href="https://www.google.com/maps/search/?api=1&query=Serviam%20Therapy%20Bat%20Yam"
                id="google-reviews-link"
                class="google-reviews-link"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span>
                    צפייה בכל חוות הדעת ב-Google
                </span>

                <span>
                    ←
                </span>

            </a>

        </div>

    </div>

</section>

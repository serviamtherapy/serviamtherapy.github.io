<!-- =========================
     SERVIAM THERAPY POPUP
========================== -->

<div id="homepage-popup" class="popup-overlay">

    <div class="popup-content">

        <!-- Close -->
        <span id="close-popup-btn" class="close-btn">&times;</span>

        <!-- Logo (Optional) -->
        <!--
        <img src="YOUR_LOGO.png"
             class="popup-logo"
             alt="Serviam Therapy">
        -->

        <h2 class="popup-title">
            💙 אנחנו מתחדשים בשבילכם
        </h2>

        <p class="popup-text">

            בימים אלו הקליניקה נמצאת בתהליך שדרוג ושיפוץ,
            כדי שנוכל להציע לכם חוויית טיפול מתקדמת,
            מקצועית ונעימה אף יותר.

            <br><br>

            בינתיים ניתן להזמין טיפול עד הבית.

            אני מגיע עם כל הציוד המקצועי הדרוש,
            ואתם רק צריכים להתכונן
            לחוויה מרגיעה שתטיב עם הגוף והנפש.

        </p>

        <button
            id="enter-site-btn"
            class="popup-btn">

            כניסה לאתר

        </button>

    </div>

</div>

<script>

const redirectURL =
"https://serviamtherapy.wixsite.com/home";

function redirectWebsite(){

    window.location.href = redirectURL;

}

document
.getElementById("close-popup-btn")
.addEventListener("click",function(e){

    e.stopPropagation();

    redirectWebsite();

});

document
.getElementById("enter-site-btn")
.addEventListener("click",function(e){

    e.stopPropagation();

    redirectWebsite();

});

document
.getElementById("homepage-popup")
.addEventListener("click",function(){

    redirectWebsite();

});

/* Prevent redirect when clicking inside popup */

document
.querySelector(".popup-content")
.addEventListener("click",function(e){

    e.stopPropagation();

});

</script>

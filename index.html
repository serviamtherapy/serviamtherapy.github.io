<!-- The Pop-up Structure -->
<div id="homepage-popup" class="popup-overlay">
  <div class="popup-content">
    <!-- Close Button -->
    <span id="close-popup-btn" class="close-btn">&times;</span>
    
    <!-- The 4-Line Message -->
    <p class="popup-text">
      בימים אלו הקליניקה נמצאת בתהליך שדרוג ושיפוץ, כדי שנוכל להציע לכם/לכן חוויית טיפול נעימה ומקצועית אף יותר.<br>
      בינתיים, אני מציע טיפולים עד הבית שלכם/כן. אני מגיע עם כל הציוד הנדרש עד אליכם/כן, ואתם/ן רק צריכים/ות<br>
      להתכונן לחוויה שתטיב איתכם/כן.
    </p>
 <button id="enter-site-btn" class="popup-btn">כניסה לאתר</button>
  </div>
</div>
  </div>
</div>

<script>
  // Redirect when the close button is clicked
  document.getElementById('close-popup-btn').addEventListener('click', function() {
    window.location.href = "https://serviamtherapy.wixsite.com/home"; // Replace with your link
  });
  // Clicking the main overlay (the dark background) triggers the redirect
  document.getElementById('homepage-popup').addEventListener('click', function() {
    window.location.href = "https://serviamtherapy.wixsite.com/home";
  });
  document.getElementById('enter-site-btn').addEventListener('click', function() {
    window.location.href = "https://serviamtherapy.wixsite.com/home"; // Replace with your link
  });

  // Clicking inside the white rectangle also triggers the redirect
  document.querySelector('.popup-content').addEventListener('click', function(e) {
    // If you ever add other interactive elements inside, this ensures everything redirects
    window.location.href = "https://serviamtherapy.wixsite.com/home";
  });
</script>

<style>
  /* Darkens the background behind the pop-up */
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #00458B;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
  }

  /* Small rectangular box in the exact middle */
  .popup-content {
    background: #e8bd31;
    padding: 35px 25px 25px 25px;
    border-radius: 8px;
    position: relative;
    max-width: 500px; /* Limits the width to keep it rectangular */
    width: 120%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    text-align: center;
    direction: rtl; /* Sets text direction from right-to-left for Hebrew */
  }

  /* X Close Button styling */
  .close-btn {
    position: absolute;
    top: 1px;
    left: 15px; /* Placed on the left because Hebrew is right-to-left */
    cursor: pointer;
    font-size: 62px;
    color: #333;
    font-weight: bold;
  }
  
  .close-btn:hover {
    color: #ff0000;
  }
 /* Red "Enter the Site" Button styling */
  .enter-site-btn {
    background-color: #D32F2F; /* Rich Red */
    color: white;
    border: none;
    padding: 10px 25px;
    font-size: 16px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  /* Hover effect for the Red button */
  .popup-btn:hover {
    background-color: #B71C1C; /* Darker Red on hover */
  }
  /* Formatting for the 4 lines of Hebrew text */
  .popup-text {
    font-family: Arial bold, sans-serif;
    font-size: 30px;
    line-height: 1.6;
    color: #333333;
    margin: 0;
  }
</style>
